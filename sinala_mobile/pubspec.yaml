name: sinala_mobile
description: A new Flutter mobile application for SINALA School Management System.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  geolocator: ^13.0.1
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/background.png

